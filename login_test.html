<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>登录测试</title>
<style>
body{font-family:sans-serif;background:linear-gradient(135deg,#fff0fa,#e8fbff);display:grid;place-items:center;min-height:100vh;margin:0;padding:20px}
form{background:#fff;border-radius:20px;padding:30px;width:100%;max-width:360px;box-shadow:0 18px 45px rgba(96,70,132,.14)}
h2{margin:0 0 6px}
input{width:100%;padding:12px;margin-bottom:12px;border:1px solid #ddd;border-radius:12px;font-size:14px;box-sizing:border-box}
button{width:100%;padding:12px;border:0;border-radius:12px;background:linear-gradient(135deg,#ff6db7,#8c7cff);color:#fff;font-weight:700;font-size:15px;cursor:pointer;margin-bottom:8px}
#err{color:#e33;font-size:13px;display:none;margin-top:10px;text-align:center}#ok{color:#090;font-size:13px;display:none;margin-top:10px;text-align:center}
p{margin:4px 0 16px;color:#666;font-size:13px}
</style></head>
<body>
<form id="f" onsubmit="return false">
<h2>星澜校园表达吧</h2><p>登录测试</p>
<input id="e" type="email" placeholder="邮箱" required>
<input id="p" type="password" placeholder="密码" required>
<button type="submit">登录</button>
<button type="button" id="r">注册</button>
<div id="err"></div><div id="ok"></div>
</form>
<script>
var SU = "https://vokmtzkqstygfyjymqhj.supabase.co";
var SA = "sb_publishable_wM4-VEvXqnDPFipQqZLlmg_t-WDIqLv";

document.getElementById("f").addEventListener("submit", async function(ev) {
  ev.preventDefault();
  console.log("SUBMIT fired");
  var email = document.getElementById("e").value.trim();
  var pass = document.getElementById("p").value;
  document.getElementById("err").style.display = "none";
  document.getElementById("ok").style.display = "none";
  try {
    console.log("Fetching auth...");
    var resp = await fetch(SU + "/auth/v1/token?grant_type=password", {
      method: "POST",
      headers: { "apikey": SA, "Content-Type": "application/json" },
      body: JSON.stringify({ email: email, password: pass })
    });
    console.log("Status:", resp.status);
    var data = await resp.json();
    console.log("Response:", data);
    if (data.access_token) {
      localStorage.setItem("sbt", data.access_token);
      var el = document.getElementById("ok");
      el.textContent = "登录成功! 用户: " + (data.user && data.user.id ? data.user.id : "ok");
      el.style.display = "block";
    } else {
      var el = document.getElementById("err");
      el.textContent = "失败: " + JSON.stringify(data);
      el.style.display = "block";
    }
  } catch(ex) {
    console.error("Error:", ex);
    var el = document.getElementById("err");
    el.textContent = "异常: " + ex.message;
    el.style.display = "block";
  }
});

document.getElementById("r").addEventListener("click", async function() {
  var email = document.getElementById("e").value.trim();
  var pass = document.getElementById("p").value;
  if (!email || pass.length < 6) {
    document.getElementById("err").textContent = "邮箱必填，密码至少6位";
    document.getElementById("err").style.display = "block";
    return;
  }
  document.getElementById("err").style.display = "none";
  try {
    console.log("Signing up...");
    var resp = await fetch(SU + "/auth/v1/signup", {
      method: "POST",
      headers: { "apikey": SA, "Content-Type": "application/json" },
      body: JSON.stringify({ email: email, password: pass })
    });
    var data = await resp.json();
    console.log("Signup response:", data);
    if (data.access_token) {
      document.getElementById("ok").textContent = "注册成功!";
      document.getElementById("ok").style.display = "block";
    } else {
      document.getElementById("ok").textContent = "注册申请已提交，请检查邮箱验证";
      document.getElementById("ok").style.display = "block";
    }
  } catch(ex) {
    document.getElementById("err").textContent = "异常: " + ex.message;
    document.getElementById("err").style.display = "block";
    console.error(ex);
  }
});
</script>
</body>
</html>
