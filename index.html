<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>星澜校园表达吧</title>
<style>
body{font-family:sans-serif;background:linear-gradient(135deg,#fff0fa,#e8fbff);display:grid;place-items:center;min-height:100vh;margin:0;padding:20px}
form{background:#fff;border-radius:20px;padding:30px;width:100%;max-width:360px;box-shadow:0 18px 45px rgba(96,70,132,.14)}
h2{margin:0 0 4px;color:#241f33}.sub{color:#7b7488;font-size:13px;margin:4px 0 20px}
input{width:100%;padding:12px;margin-bottom:12px;border:1px solid #ddd;border-radius:12px;font-size:14px;box-sizing:border-box}
button{width:100%;padding:12px;border:0;border-radius:12px;background:linear-gradient(135deg,#ff6db7,#8c7cff);color:#fff;font-weight:700;font-size:15px;cursor:pointer;margin-bottom:8px}
#r{background:var(--card);color:#241f33;border:1px solid #ddd}#err{color:#e33;font-size:13px;display:none;margin-top:10px;text-align:center}
p{color:#666;font-size:12px;text-align:center;margin-top:16px}
</style></head>
<body>
<form id="f">
<h2>星澜校园表达吧</h2><p class="sub">同学都在用的校园社区</p>
<input id="e" type="email" placeholder="邮箱" required>
<input id="p" type="password" placeholder="密码" required>
<button type="submit">登录</button>
<button type="button" id="r">注册</button>
<div id="err"></div>
<p>注册后自动登录 · 邮箱验证已关闭</p>
</form>
<script>
var SU="https://vokmtzkqstygfyjymqhj.supabase.co";
var SA="sb_publishable_wM4-VEvXqnDPFipQqZLlmg_t-WDIqLv";
document.getElementById("f").addEventListener("submit",async function(e){
  e.preventDefault();
  var em=document.getElementById("e").value.trim();
  var pw=document.getElementById("p").value;
  document.getElementById("err").style.display="none";
  try{
    var r=await fetch(SU+"/auth/v1/token?grant_type=password",{method:"POST",headers:{"apikey":SA,"Content-Type":"application/json"},body:JSON.stringify({email:em,password:pw})});
    var d=await r.json();
    if(d.access_token){localStorage.setItem("sbt",d.access_token);window.location.href="/app.html"}
    else{document.getElementById("err").textContent=d.msg||d.error||"登录失败";document.getElementById("err").style.display="block"}
  }catch(ex){document.getElementById("err").textContent=ex.message;document.getElementById("err").style.display="block"}
});
document.getElementById("r").addEventListener("click",async function(){
  var em=document.getElementById("e").value.trim();
  var pw=document.getElementById("p").value;
  if(!em||pw.length<6){document.getElementById("err").textContent="邮箱必填";document.getElementById("err").style.display="block";return}
  document.getElementById("err").style.display="none";
  try{
    var r=await fetch(SU+"/auth/v1/signup",{method:"POST",headers:{"apikey":SA,"Content-Type":"application/json"},body:JSON.stringify({email:em,password:pw})});
    var d=await r.json();
    if(d.access_token){localStorage.setItem("sbt",d.access_token);window.location.href="/app.html"}
    else{document.getElementById("err").textContent=d.msg||d.error||"注册失败";document.getElementById("err").style.display="block"}
  }catch(ex){document.getElementById("err").textContent=ex.message;document.getElementById("err").style.display="block"}
});
</script>
</body>
</html>
